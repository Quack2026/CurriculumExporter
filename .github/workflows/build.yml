name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Roslyn compiler
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere not found' }
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found' }
          $csc = Join-Path $vs 'MSBuild\Current\Bin\Roslyn\csc.exe'
          if (-not (Test-Path $csc)) { throw "Roslyn csc not found: $csc" }
          "CSC=$csc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "using: $csc"
          & $csc /version

      - name: Build (deterministic)
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'curriculum-exporter.exe'
          & $env:CSC /nologo /target:winexe /deterministic /codepage:65001 /optimize+ `
            /win32manifest:src\app.manifest /win32icon:src\app.ico `
            "/out:$out" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll `
            src\Program.cs src\Network.cs src\IcsBuilder.cs
          if ($LASTEXITCODE -ne 0) { throw "build failed (exit $LASTEXITCODE)" }
          Get-Item $out | Format-List Name, Length, LastWriteTime

      - name: Show SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\curriculum-exporter.exe -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          @"
          ### 构建产物哈希

          ````
          curriculum-exporter.exe
          SHA256: $hash
          ````
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-exporter
          path: curriculum-exporter.exe

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: curriculum-exporter.exe